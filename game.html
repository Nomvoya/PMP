                    width: min(100%, 360px); padding: 24px;
                    color: var(--secondary); background: #fff; border: 2px solid var(--line);
                    border-radius: 24px; box-shadow: 0 16px 40px rgba(16, 35, 63, .24);
                    text-align: center;
                }
                .k3-menu-dialog h2 {
                    margin: 0 0 8px; color: var(--primary);
                    font: 900 24px/1.2 'Fredoka', 'Nunito', system-ui, sans-serif;
                }
                .k3-menu-dialog p { margin: 0 0 20px; line-height: 1.5; }
                .k3-menu-actions { display: grid; gap: 12px; }
                .k3-menu-action {
                    min-height: 48px; padding: 10px 16px;
                    color: var(--secondary); background: #fff;
                    border: 2px solid var(--line); border-radius: 14px;
                    font: 800 15px/1.2 'Nunito', system-ui, sans-serif;
                    cursor: pointer; touch-action: manipulation;
                }
                .k3-menu-action.primary {
                    color: #fff; background: var(--primary);
                    border-color: var(--primary); box-shadow: 0 4px 0 var(--primary-dark);
                }
                .k3-menu-action:active { transform: translateY(2px); }
                .k3-menu-action:focus-visible, .k3-menu-trigger:focus-visible {
                    outline: 3px solid var(--accent); outline-offset: 3px;
                }
            `;
            gameDocument.head.append(style);

            const trigger = gameDocument.createElement('button');
            trigger.type = 'button';
            trigger.className = 'k3-menu-trigger';
            trigger.setAttribute('aria-label', 'Buka menu permainan');
            trigger.setAttribute('aria-haspopup', 'dialog');
            trigger.setAttribute('aria-expanded', 'false');
            trigger.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';

            const backdrop = gameDocument.createElement('div');
            backdrop.className = 'k3-menu-backdrop';
            backdrop.hidden = true;
            backdrop.innerHTML = `
                <section class="k3-menu-dialog" role="dialog" aria-modal="true" aria-labelledby="k3MenuTitle" aria-describedby="k3MenuDescription">
                    <h2 id="k3MenuTitle">Menu Permainan</h2>
                    <p id="k3MenuDescription">Pilih untuk melanjutkan atau kembali ke Pilih Modul.</p>
                    <div class="k3-menu-actions" id="k3MenuOptions">
                        <button class="k3-menu-action primary" type="button" data-menu-action="continue">Lanjut Bermain</button>
                        <button class="k3-menu-action" type="button" data-menu-action="exit">Kembali ke Pilih Modul</button>
                    </div>
                    <div class="k3-menu-actions" id="k3ExitConfirmation" hidden>
                        <button class="k3-menu-action" type="button" data-menu-action="cancel">Batal</button>
                        <button class="k3-menu-action primary" type="button" data-menu-action="confirm-exit">Ya, Kembali ke Pilih Modul</button>
                    </div>
                </section>
            `;
            stage.append(trigger, backdrop);

            const title = backdrop.querySelector('#k3MenuTitle');
            const description = backdrop.querySelector('#k3MenuDescription');
            const options = backdrop.querySelector('#k3MenuOptions');
            const confirmation = backdrop.querySelector('#k3ExitConfirmation');
            const continueButton = backdrop.querySelector('[data-menu-action="continue"]');

            function closeMenu() {
                backdrop.hidden = true;
                trigger.setAttribute('aria-expanded', 'false');
                trigger.focus();
            }

            trigger.addEventListener('click', () => {
                backdrop.hidden = false;
                trigger.setAttribute('aria-expanded', 'true');
                continueButton.focus();
            });

            backdrop.addEventListener('click', (event) => {
                if (event.target === backdrop) {
                    closeMenu();
                    return;
                }

                const action = event.target.closest('[data-menu-action]');
                if (!action) return;

                if (action.dataset.menuAction === 'continue') {
                    closeMenu();
                } else if (action.dataset.menuAction === 'exit') {
                    title.textContent = 'Kembali ke Pilih Modul?';
                    description.textContent = 'Progres level dan skor K3 Walk saat ini akan direset.';
                    options.hidden = true;
                    confirmation.hidden = false;
                    confirmation.querySelector('[data-menu-action="cancel"]').focus();
                } else if (action.dataset.menuAction === 'cancel') {
                    title.textContent = 'Menu Permainan';
                    description.textContent = 'Pilih untuk melanjutkan atau kembali ke Pilih Modul.';
                    confirmation.hidden = true;
                    options.hidden = false;
                    options.querySelector('[data-menu-action="exit"]').focus();
                } else if (action.dataset.menuAction === 'confirm-exit') {
                    levelScores = {};
                    window.location.href = 'beranda.html';
                }
            });

            gameDocument.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !backdrop.hidden) closeMenu();
            });
        }

        function getTotalScore() {
            return Object.values(levelScores).reduce((total, result) => total + result.score, 0);
        }

        function getScoreResults() {
            return [1, 2, 3, 4, 5].map((level) => levelScores[level]);
        }

        function loadLevel(level) {
            currentLevel = level;
            frame.title = `K3 Walk - Level ${level}`;
            const bytes = Uint8Array.from(atob(levelDocuments[level]), (character) => character.charCodeAt(0));
            frame.srcdoc = new TextDecoder().decode(bytes);
        }

        window.addEventListener('message', (event) => {
            if (event.source !== frame.contentWindow || !event.data) return;
            if (event.data.type === 'K3WALK_LEVEL_COMPLETE' && event.data.from === currentLevel) {
                const hasFatalHazard = event.data.fatalLeft === true && (currentLevel === 2 || currentLevel === 3);
                const deduction = hasFatalHazard ? 10 : 0;
                const reason = currentLevel === 2 ? 'Tumpukan miring dibiarkan' : 'Kabel terbuka dibiarkan';
                levelScores[currentLevel] = {
                    level: currentLevel,
                    base: 20,
                    deduction,
                    reason: hasFatalHazard ? reason : '',
                    score: 20 - deduction
                };
                frame.contentWindow.postMessage({
                    type: 'K3WALK_SCORE_UPDATE',
                    from: currentLevel,
                    total: getTotalScore()
                }, '*');
            } else if (event.data.type === 'K3WALK_NEXT' && event.data.from === currentLevel &&
                       currentLevel < 5 && levelScores[currentLevel]) {
                loadLevel(currentLevel + 1);
            } else if (event.data.type === 'K3WALK_SHOW_SCORE' && event.data.from === currentLevel &&
                       currentLevel === 5 && getScoreResults().every(Boolean)) {
                frame.contentWindow.postMessage({
                    type: 'K3WALK_SCORE_SUMMARY',
                    from: currentLevel,
                    total: getTotalScore(),
                    results: getScoreResults()
                }, '*');
            } else if (event.data.type === 'K3WALK_RESTART' && event.data.from === currentLevel &&
                       currentLevel === 5 && levelScores[currentLevel]) {
                levelScores = {};
                loadLevel(1);
            }
        });

        frame.addEventListener('load', installGameMenu);
        loadLevel(1);
    </script>
</body>
</html>
